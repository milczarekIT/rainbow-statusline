name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # The installers download the latest release, so an installer change that needs
  # a new archive name fails here until that release exists.
  install-sh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh install.sh
      - run: ~/.local/bin/rainbow-statusline --version

  install-ps1:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Through iex, as the README says: a failure there does not fail the step,
      # so the next step is what catches it.
      - run: Get-Content -Raw install.ps1 | Invoke-Expression
      - run: |
          & "$env:LOCALAPPDATA\Programs\rainbow-statusline\rainbow-statusline.exe" --version
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -notlike '*rainbow-statusline*') { throw 'install folder is not on the user PATH' }
