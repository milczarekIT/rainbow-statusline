name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # The installers download the latest release, so an installer change that needs
  # a new archive name fails here until that release exists.
  install-sh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: sh install.sh
      - run: ~/.local/bin/rainbow-statusline --version

  install-ps1:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Through iex, as the README says: a failure there does not fail the step,
      # so the next step is what catches it.
      - run: Get-Content -Raw install.ps1 | Invoke-Expression
      - run: |
          & "$env:LOCALAPPDATA\Programs\rainbow-statusline\rainbow-statusline.exe" --version
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -notlike '*rainbow-statusline*') { throw 'install folder is not on the user PATH' }

  # Installs the published package, so it checks the latest release, not this commit.
  scoop:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH
      - run: scoop bucket add milczarekIT https://github.com/milczarekIT/scoop-bucket
      - run: scoop install rainbow-statusline
      - run: rainbow-statusline --version
