name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require a commit on main with green tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          for _ in $(seq 1 12); do
            run=$(gh run list --workflow CI --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 10
          done
          test -n "$run"
          gh run watch "$run" --interval 15 >/dev/null
          test "$(gh run view "$run" --json jobs --jq '[.jobs[] | select(.name | startswith("test (")) | .conclusion] | length == 3 and all(. == "success")')" = true
      - run: go test ./...
      # Homebrew and Scoop are published only once their repositories exist and
      # the repository variable PUBLISH_PACKAGES is "true" (docs/release.md).
      - name: Release to GitHub only
        if: vars.PUBLISH_PACKAGES != 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --skip=homebrew,scoop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release to GitHub, Homebrew and Scoop
        if: vars.PUBLISH_PACKAGES == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
