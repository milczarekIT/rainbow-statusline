version: 2
project_name: rainbow-statusline

builds:
  - id: rainbow-statusline
    main: ./cmd/rainbow-statusline
    binary: rainbow-statusline
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - id: default
    # No version in the name, so releases/latest/download/<name> is a stable URL.
    name_template: "rainbow-statusline_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  prerelease: auto

# A plain formula, not a cask: a cask download is quarantined and an unsigned
# binary would be blocked by Gatekeeper. goreleaser deprecates "brews" but still
# supports it in the pinned version (docs/release.md). skip_upload: auto keeps
# pre-release tags out of the tap and the bucket.
brews:
  - name: rainbow-statusline
    repository:
      owner: milczarekIT
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/milczarekIT/rainbow-statusline
    description: Unified status line for AI coding assistants
    skip_upload: auto
    test: |
      assert_match "ctx", shell_output("echo '{}' | #{bin}/rainbow-statusline --agent claude")

scoops:
  - name: rainbow-statusline
    repository:
      owner: milczarekIT
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/milczarekIT/rainbow-statusline
    description: Unified status line for AI coding assistants
    skip_upload: auto
